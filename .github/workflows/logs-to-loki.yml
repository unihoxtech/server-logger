name: Build and Push Grafana + Loki Stack to DOCR

on:
  push:
    branches:
      - prod
      - main
      - staging
      - testing

jobs:
  push-loki:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: registry.digitalocean.com
      REPO_NAME: unihox-live
      IMAGE_NAME: server-logger-loki
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag for Loki
        run: |
          case "${BRANCH_NAME}" in
            prod)
              echo "IMAGE_TAG=latest" >> $GITHUB_ENV
              ;;
            main|staging)
              echo "IMAGE_TAG=staging" >> $GITHUB_ENV
              ;;
            testing)
              echo "IMAGE_TAG=testing" >> $GITHUB_ENV
              ;;
            *)
              echo "Unsupported branch: ${BRANCH_NAME}"
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: help@aiyuh.com
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build and push Loki image
        uses: docker/build-push-action@v6
        with:
          context: ./loki
          file: ./loki/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify Loki image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || {
            echo "❌ Loki image pull failed"
            exit 1
          }

  push-grafana:
    runs-on: ubuntu-latest
    needs: push-loki
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: registry.digitalocean.com
      REPO_NAME: unihox-live
      IMAGE_NAME: server-logger-grafana
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag for Grafana
        run: |
          case "${BRANCH_NAME}" in
            prod)
              echo "IMAGE_TAG=latest" >> $GITHUB_ENV
              ;;
            main|staging)
              echo "IMAGE_TAG=staging" >> $GITHUB_ENV
              ;;
            testing)
              echo "IMAGE_TAG=testing" >> $GITHUB_ENV
              ;;
            *)
              echo "Unsupported branch: ${BRANCH_NAME}"
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: help@aiyuh.com
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build and push Grafana image
        uses: docker/build-push-action@v6
        with:
          context: ./grafana
          file: ./grafana/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify Grafana image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || {
            echo "❌ Grafana image pull failed"
            exit 1
          }
