name: Build and Push Unified Logger Image to DOCR

on:
  push:
    branches:
      - main
      - prod
      - staging
      - testing

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      REGISTRY: registry.digitalocean.com
      REPO_NAME: unihox-live
      IMAGE_NAME: server-logger
      BRANCH_NAME: ${{ github.ref_name }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Set Docker image tag based on branch
        run: |
          case "${BRANCH_NAME}" in
            prod)
              echo "IMAGE_TAG=latest" >> "$GITHUB_ENV" ;;
            main | staging)
              echo "IMAGE_TAG=staging" >> "$GITHUB_ENV" ;;
            testing)
              echo "IMAGE_TAG=testing" >> "$GITHUB_ENV" ;;
            *)
              echo "❌ Unsupported branch: ${BRANCH_NAME}"
              exit 1 ;;
          esac

      - name: 🔍 Validate required files exist
        run: |
          REQUIRED_FILES=(
            Dockerfile
            promtail/promtail.yaml
            loki/loki-config.yaml
            supervisor/supervisord.conf
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "❌ Missing file: $file"
              exit 1
            fi
          done

      - name: 🧱 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: help@aiyuh.com
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: 🚀 Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:cache
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=inline

      - name: ✅ Verify image was pushed
        run: |
          echo "🛠 Pulling image to verify..."
          docker pull "${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" || {
            echo "❌ Image pull failed"
            exit 1
          }

      - name: 📣 Success
        run: echo "✅ Image pushed and verified successfully!"
      - name: 🚢 Auto-Deploy to Droplet
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          script: |
            cd /root/unified-logger || cd ~/unified-logger || exit 1
            docker login ${{ env.REGISTRY }} -u help@aiyuh.com -p '${{ secrets.DO_REGISTRY_TOKEN }}'
            docker pull ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            docker compose down || docker-compose down || true
            docker compose up -d || docker-compose up -d
            docker system prune -f

      - name: 📤 Send logs to Loki
        if: always()
        env:
          LOKI_URL: http://68.183.83.78:3100/loki/api/v1/push
        run: |
          if [[ -f mylogs.txt ]]; then
            LOG_CONTENT=$(cat mylogs.txt | jq -R -s .)
            TIMESTAMP=$(date --utc +%Y-%m-%dT%H:%M:%SZ)

            echo "{
              \"streams\": [
                {
                  \"labels\": \"{job=\\\"github-actions\\\",repo=\\\"${GITHUB_REPOSITORY}\\\"}\",
                  \"entries\": [
                    { \"ts\": \"${TIMESTAMP}\", \"line\": ${LOG_CONTENT} }
                  ]
                }
              ]
            }" > loki-payload.json

            curl -XPOST "$LOKI_URL" \
              -H "Content-Type: application/json" \
              --data-binary @loki-payload.json
          else
            echo "⚠️ No mylogs.txt file found, skipping Loki upload."
          fi  