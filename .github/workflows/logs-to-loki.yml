name: Build and Push Server Logger to DOCR

on:
  push:
    branches:
      - prod
      - main
      - staging
      - testing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: registry.digitalocean.com
      REPO_NAME: unihox-live
      IMAGE_NAME: server-logger
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag based on branch
        run: |
          case "${BRANCH_NAME}" in
            prod)
              echo "IMAGE_TAG=latest" >> $GITHUB_ENV
              ;;
            main|staging)
              echo "IMAGE_TAG=staging" >> $GITHUB_ENV
              ;;
            testing)
              echo "IMAGE_TAG=testing" >> $GITHUB_ENV
              ;;
            *)
              echo "Unsupported branch: ${BRANCH_NAME}"
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: help@aiyuh.com
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            BRANCH_NAME=${{ env.BRANCH_NAME }}

      - name: Verify Docker image push
        run: |
          echo "🔍 Verifying image availability..."
          docker pull ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || {
            echo "❌ Failed to verify pushed image"
            exit 1
          }
