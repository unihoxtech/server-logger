name: Build & Push Unified Logger Image to DOCR

on:
  push:
    branches:
      - main
      - prod
      - staging
      - testing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      REGISTRY: registry.digitalocean.com
      REPO_NAME: unihox-live
      IMAGE_NAME: server-logger
      BRANCH_NAME: ${{ github.ref_name }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4 

      - name: 🏷️ Set Docker image tag based on branch
        run: |
          case "${BRANCH_NAME}" in
            prod)
              echo "IMAGE_TAG=latest" >> $GITHUB_ENV ;;
            main|staging)
              echo "IMAGE_TAG=staging" >> $GITHUB_ENV ;;
            testing)
              echo "IMAGE_TAG=testing" >> $GITHUB_ENV ;;
            *)
              echo "❌ Unsupported branch: ${BRANCH_NAME}"
              exit 1 ;;
          esac

      - name: 🔍 Validate required files exist
        run: |
          for file in Dockerfile \
                      promtail/promtail-config.yaml \
                      loki/config.yaml \
                      supervisor/supervisord.conf; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing file: $file"
              exit 1
            fi
          done

      - name: 🧱 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: help@aiyuh.com
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: 🚀 Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:cache
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=inline

      - name: ✅ Verify image was pushed
        run: |
          echo "🛠 Pulling image to verify..."
          docker pull ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || {
            echo "❌ Image pull failed"
            exit 1
          }

      - name: 📣 Success
        run: echo "✅ Image pushed and verified successfully!"
