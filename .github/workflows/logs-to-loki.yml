name: Build & Push Unified Logger Image to DOCR

on:
  push:
    branches:
      - main
      - prod
      - staging
      - testing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: registry.digitalocean.com
      REPO_NAME: unihox-live
      IMAGE_NAME: server-logger
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: |
          case "${BRANCH_NAME}" in
            prod)
              echo "IMAGE_TAG=latest" >> $GITHUB_ENV ;;
            main|staging)
              echo "IMAGE_TAG=staging" >> $GITHUB_ENV ;;
            testing)
              echo "IMAGE_TAG=testing" >> $GITHUB_ENV ;;
            *)
              echo "Unsupported branch: ${BRANCH_NAME}"
              exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@v3

      - name: Login to DOCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: help@aiyuh.com
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || {
            echo "❌ Image pull failed"
            exit 1
          }
